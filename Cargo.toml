[workspace]
resolver = "3"
members = ["crates/buzz-host", "crates/buzz-backend-ssh"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
strip = true
